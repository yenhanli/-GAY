<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六格小人亂鬥</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1d1f2b;
      overflow: hidden;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      color: #f4ecd8;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      /* 整個場地塞進畫面，等比例縮放 */
      width: min(100vw, calc(100vh * 1000 / 880));
      height: auto;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* 蓋在場地上面的畫面（首頁、等人、訊息） */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(20, 22, 32, 0.82);
      text-align: center;
    }
    .hidden { display: none; }
    h1 { font-size: 48px; margin: 0 0 12px; letter-spacing: 4px; }
    button {
      font: inherit;
      font-size: 22px;
      padding: 10px 28px;
      border: 4px solid #3a2f22;
      background: #ffd84a;
      color: #3a2f22;
      cursor: pointer;
    }
    button:hover { background: #ffe57d; }
    button:disabled { opacity: 0.45; cursor: default; }
    /* 選部族的按鈕 */
    button.tribe {
      width: 230px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f4ecd8;
      font-size: 24px;
    }
    button.tribe small { font-size: 15px; line-height: 1.4; }
    button.tribe.chosen { background: #ffd84a; outline: 4px solid #fff3a0; }
    button.plain { background: transparent; color: #f4ecd8; border-color: #8a8fa3; font-size: 18px; }
    input {
      font: inherit;
      font-size: 26px;
      width: 5em;
      padding: 8px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 6px;
      border: 4px solid #3a2f22;
    }
    .row { display: flex; gap: 10px; }
    .or { color: #8a8fa3; }
    .error { color: #ff5a5a; min-height: 1.4em; margin: 0; font-size: 18px; }
    .code { font-size: 96px; font-weight: bold; letter-spacing: 16px; color: #ffd84a; }
    .big { font-size: 36px; margin: 0; }
  </style>
</head>
<body>
  <canvas id="game" width="1000" height="880"></canvas>

  <!-- 首頁 -->
  <div id="home" class="screen">
    <h1>六格小人亂鬥</h1>
    <div class="row">
      <button id="btnCreate1v1">開房間（1v1）</button>
      <button id="btnCreateFFA">開房間（3 人亂鬥）</button>
    </div>
    <div class="or">或是輸入朋友的房號</div>
    <div class="row">
      <input id="codeInput" maxlength="4" placeholder="房號" autocomplete="off">
      <button id="btnJoin">加入</button>
    </div>
    <div class="or">或是自己練習</div>
    <div class="row">
      <button id="btnPractice1v1" class="plain">練習 1v1（打 1 隻機器人）</button>
      <button id="btnPracticeFFA" class="plain">練習亂鬥（打 2 隻機器人）</button>
    </div>
    <p id="homeError" class="error"></p>
  </div>

  <!-- 開房後等對手 -->
  <div id="waiting" class="screen hidden">
    <p id="waitingTitle" class="big">把房號給對手</p>
    <div id="roomCode" class="code">····</div>
    <p id="waitingHint">等對手加入⋯</p>
    <button id="btnCancel" class="plain">取消</button>
  </div>

  <!-- 每回合開始前選部族 -->
  <div id="pick" class="screen hidden">
    <h1>選部族</h1>
    <div id="pickList" class="row"></div>
    <p id="pickHint"></p>
  </div>

  <!-- 整局結束 -->
  <div id="result" class="screen hidden">
    <h1 id="resultTitle">你贏了！</h1>
    <p id="resultScore" class="big"></p>
    <div class="row">
      <button id="btnRematch">再來一局</button>
      <button id="btnHome" class="plain">回首頁</button>
    </div>
    <p id="rematchHint"></p>
  </div>

  <!-- 大字訊息（例如對手斷線） -->
  <div id="message" class="screen hidden">
    <p id="messageText" class="big"></p>
  </div>

  <!-- 順序有差：後面的檔會用到前面的東西 -->
  <!-- ?v=15 是版本號：每次更新程式就把所有的 v= 改成下一個數字，
       瀏覽器才會重新下載，不會拿到新舊混在一起的檔案 -->
  <script src="config.js?v=15"></script>
  <script src="input.js?v=15"></script>
  <script src="arena.js?v=15"></script>
  <script src="player.js?v=15"></script>
  <script src="bullet.js?v=15"></script>
  <script src="tribes/basic.js?v=15"></script>
  <script src="tribes/mecha.js?v=15"></script>
  <script src="tribes/future.js?v=15"></script>
  <script src="hud.js?v=15"></script>
  <script src="round.js?v=15"></script>
  <script src="bot.js?v=15"></script>
  <script src="net.js?v=15"></script>
  <script src="main.js?v=15"></script>
</body>
</html>
